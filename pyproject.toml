[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77.0.3",
  "setuptools-scm>=8",
]

[project]
name = "open-free-energy"
description = ""
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "The OpenFE developers", email = "openfreeenergy@omsf.io" } ]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dynamic = [ "version" ]
dependencies = [
  "cinnabar~=0.6.0",
  "citeproc-py <0.10.3",  # the default harvard1 style used by duecredit was changed in 0.10.3, this avoids needing an extra dependency on citeproc-py-styles
  "click >=8.2.0, <8.5.0",  # until the deprecation warnings are addressed by https://github.com/OpenFreeEnergy/openfe/pull/2251
  "duecredit",
  "exorcist ~= 0.1.0",
  "gufe ~=1.13.1",
  "kartograf ~=2.0.0",
  "konnektor ~=0.5.0",
  "lomap2 ~=3.3.0",
  "matplotlib",
  "networkx",
  "numpy",
  "openfe-analysis ~=0.5.0",
  # I bumped the upper and lower pin of the toolkit since the yanked release confuses pypi
  "openff-toolkit >=0.20.1,<0.21",  # upper pinning 0.21, just so we can test it before conda-forge pulls it in.
  # I bumped this to ~=0.5.0, it was ~=0.4.0
  "openff-units ~=0.5.0",  # adds pydantic 2.13 support
  "openmm !=8.1.0,!=8.3,>=8.0.0,<8.5.0",  # omit 8.3.0 and 8.3.1 due to https://github.com/openmm/openmm/pull/5069
  "openmmforcefields >=0.15.1",  # min needed for https://github.com/openmm/openmmforcefields/pull/414
  # I bumped  this to ~=0.27.0 from ~=0.26.0 since the newer one is the first we have on pypi
  "openmmtools ~=0.27.0",  # fix to support membrane barostat: https://github.com/choderalab/openmmtools/pull/798, and wait to test against 0.27
  "packaging",
  "pint >=0.24.0",
  "plugcli",
  "pooch >=1.9.0",  # min needed for https://github.com/fatiando/pooch/issues/502
  "pydantic ~=2.13.0", # don't trust that 2.14 won't break
  "pygraphviz",
  "pymbar >=4.0",
  "pytest",
  "pytest-regressions",
  "pytest-rerunfailures",
  "rdkit<2026.03",  # https://github.com/OpenFreeEnergy/openfe/issues/2067
  "rich",
  "threadpoolctl",
  "typing-extensions",
]
urls = { Homepage = "https://github.com/OpenFreeEnergy/openfe" }
scripts.openfe = "openfecli.cli:main"

[tool.setuptools]
packages.find.where = [ "src" ]
packages.find.namespaces = false
include-package-data = true
package-data.openfe = [ '"./src/openfe/tests/data/lomap_basic/toluene.mol2"' ]
zip-safe = false

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.ruff]
line-length = 100
format.docstring-code-format = true
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
lint.select = [
  "E", # pycodestyle errors
  "F", # Pyflakes
  "I", # isort
  "W", # pycodestyle warnings
  # "C901"  # mccabe complexity  TODO: add this back in
  # "UP", # TODO: add this in
]
lint.ignore = [
  "E402", # module-level import not at top (conflicts w/ isort)
  "E501", # line length too long, resolve this for comments
  "F401", # unused imports (TODO: we should fix these)
  "F811",
  "F841",
  "UP03", # pyupgrade linting (TODO: we should fix these)
]
lint.isort.known-first-party = [ "openfe" ]

[tool.mypy]
files = "src/openfe"  # TODO: add src/openfecli
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage]
run.omit = [
  "src/*/tests/dev/*py",
  "src/*/tests/protocols/test_openmm_rfe_slow.py",
  "src/openfe/due.py",
]
report.exclude_lines = [
  "-no-cov",
  'if __name__ == "__main__"',
  "pragma: no cover",
  "pragma: no-cover",
  "raise NotImplementedError",
]
